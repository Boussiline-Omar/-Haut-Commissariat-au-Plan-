version: '3.8'

services:
  api:
    build: .
    container_name: rgph-api
    ports:
      - "8000:8000"
    environment:
      - MODELS_DIR=/app/outputs/
    volumes:
      - ./outputs:/app/outputs
      - ./static:/app/static
      - ./rgph_dashboard.html:/app/rgph_dashboard.html
      - ./main.py:/app/main.py
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
