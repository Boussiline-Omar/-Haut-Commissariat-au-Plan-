services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODELS_DIR=/app/models/
      - OUTPUTS_DIR=/app/outputs/
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./static:/app/static
      - ./rgph_dashboard.html:/app/rgph_dashboard.html
      - ./main.py:/app/main.py
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
